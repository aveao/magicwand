[project]
name = "magicwand"
version = "0.1.0"
description = "Simple script to sync Tailscale MagicDNS to Cloudflare DNS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests~=2.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff~=0.15",
]

[tool.uv]
exclude-newer = "1 week"

[project.scripts]
magicwand = "main:main"
